        const params = new URLSearchParams(window.location.search);
        const trip = params.get('trip');
        const container = document.getElementById('viaggi-container');
        const mapTitle = document.querySelector('#mappa-trip h2');
        let tripMap = null;

        function getCurrentLanguage() {
            return window.localStorage.getItem('travel-language') === 'en' ? 'en' : 'it';
        }

        function getDictionary(language) {
            return localizedVlogData[language] || localizedVlogData.it;
        }

        function buildResponsivePicture(imageSrc, altText) {
            const optimizedBase = typeof getOptimizedImageBase === 'function' ? getOptimizedImageBase(imageSrc) : '';

            if (!optimizedBase) {
                return `
                <img
                    src="${imageSrc}"
                    alt="${altText}"
                    loading="lazy"
                    decoding="async">
            `;
            }

            // Nuova regola: su desktop (oltre 900px) usa 800px
            const sizes = '(max-width: 900px) 100vw, 800px';

            return `
                <picture>
                    <source
                        srcset="${optimizedBase}-480.avif 480w, ${optimizedBase}-768.avif 768w, ${optimizedBase}-1200.avif 1200w"
                        sizes="${sizes}"
                        type="image/avif">
                    <source
                        srcset="${optimizedBase}-480.webp 480w, ${optimizedBase}-768.webp 768w, ${optimizedBase}-1200.webp 1200w"
                        sizes="${sizes}"
                        type="image/webp">
                    <img
                        src="${optimizedBase}-768.jpg"
                        alt="${altText}"
                        loading="lazy"
                        decoding="async"
                        onerror="this.onerror=null;this.src='${imageSrc}';">
                </picture>
            `;
        }

        function renderMap(currentTrip, dictionary) {
            const tripConfig = dictionary.maps[currentTrip];
            const labels = dictionary.labels;
            const mapSection = document.getElementById('mappa-trip');
            const caption = document.getElementById('trip-map-caption');
            const mapEl = document.getElementById('trip-map');

            if (tripMap) {
                tripMap.remove();
                tripMap = null;
            }

            mapEl.innerHTML = '';

            if (!tripConfig || !tripConfig.points || !tripConfig.points.length || typeof L === 'undefined') {
                mapSection.hidden = true;
                return;
            }

            mapSection.hidden = false;
            mapTitle.textContent = labels.mapTitle;
            caption.textContent = tripConfig.caption;

            tripMap = L.map(mapEl, { scrollWheelZoom: false });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(tripMap);

            const latLngs = tripConfig.points.map((point) => {
                const marker = L.marker([point.lat, point.lng]).addTo(tripMap);
                marker.bindPopup(point.name);
                return [point.lat, point.lng];
            });

            if (latLngs.length > 1) {
                L.polyline(latLngs, { color: '#ec994b', weight: 4, opacity: 0.85 }).addTo(tripMap);
            }

            tripMap.fitBounds(latLngs, { padding: [24, 24] });
        }

        function renderTripPage(language) {
            const dictionary = getDictionary(language);
            const labels = dictionary.labels;
            const contenuti = dictionary.trips[trip];
            const tripLabel = labels.tripNames[trip] || trip;

            container.innerHTML = '';

            if (!contenuti || !contenuti.length) {
                container.innerHTML = `
        <section class="empty-state">
          <h1>${labels.emptyTitle}</h1>
          <p>${labels.emptyText}</p>
        </section>
      `;
                renderMap(null, dictionary);
                return;
            }

            contenuti.forEach((giorno) => {
                const sezione = document.createElement('section');
                sezione.className = 'viaggio';
                sezione.innerHTML = `
                ${buildResponsivePicture(giorno.immagine, tripLabel)}
          <div class="descrizione">
            <h2>${labels.days} ${giorno.giorni} - ${tripLabel}</h2>
            <p>${giorno.titolo}</p>
            <ul>
              ${giorno.testo.map((riga) => `<li>${riga}</li>`).join('')}
            </ul>
          </div>
        `;
                container.appendChild(sezione);
            });

            renderMap(trip, dictionary);
        }

        document.addEventListener('languagechange', function (event) {
            renderTripPage(event.detail.language);
        });

        renderTripPage(getCurrentLanguage());
    </script>
